[package]
name = "rivet"
version = "0.4.0"
edition = "2024"
description = "A classic Linux file manager, like Nemo, Thunar and Caja, written in Rust/egui — no GTK or Qt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ulinaaron/rivet-files"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
libc = "0.2.191"
skrifa = "0.44.0"
resvg = { version = "0.50.0", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
